<body class="min-h-screen flex flex-col relative pb-32">
<!-- Main Canvas -->
<main class="flex-grow flex flex-col px-container-margin pt-12 pb-stack-lg gap-stack-lg relative z-10">
<!-- Celebration Hero -->
<section class="flex flex-col items-center text-center gap-stack-md mt-8">
<div class="relative w-40 h-40 flex items-center justify-center rounded-full bg-surface-container-high shadow-lg">
<div class="absolute inset-0 bg-primary-container opacity-20 rounded-full animate-pulse"></div>
<span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
<h1 class="text-display-lg font-display-lg text-primary">Victory!</h1>
<p class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">You won 7 of 9 rounds!</p>
</section>
<!-- Round Breakdown -->
<section class="flex flex-col gap-stack-sm bg-surface-container rounded-lg p-stack-md shadow-[0_8px_20px_-4px_rgba(0,0,0,0.08)]">
<h2 class="text-label-xl font-label-xl text-on-surface-variant mb-2">Round Breakdown</h2>
<!-- List Item Won -->
<div class="flex items-center justify-between p-3 bg-surface rounded-DEFAULT shadow-[0_4px_12px_-4px_rgba(0,0,0,0.05)]">
<span class="text-body-lg font-body-lg text-on-surface">Round 1</span>
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-xl font-label-xl">Won</span>
</div>
</div>
<!-- List Item Won -->
<div class="flex items-center justify-between p-3 bg-surface rounded-DEFAULT shadow-[0_4px_12px_-4px_rgba(0,0,0,0.05)]">
<span class="text-body-lg font-body-lg text-on-surface">Round 2</span>
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-xl font-label-xl">Won</span>
</div>
</div>
<!-- List Item Lost -->
<div class="flex items-center justify-between p-3 bg-surface rounded-DEFAULT shadow-[0_4px_12px_-4px_rgba(0,0,0,0.05)]">
<span class="text-body-lg font-body-lg text-on-surface">Round 3</span>
<div class="flex items-center gap-2 text-error">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">cancel</span>
<span class="text-label-xl font-label-xl">Lost</span>
</div>
</div>
<!-- List Item Won -->
<div class="flex items-center justify-between p-3 bg-surface rounded-DEFAULT shadow-[0_4px_12px_-4px_rgba(0,0,0,0.05)]">
<span class="text-body-lg font-body-lg text-on-surface">Round 4</span>
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>

</div>
</div>

</div>
</div>
