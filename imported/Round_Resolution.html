<body class="bg-background text-on-background min-h-screen flex flex-col font-sans">
<!-- TopAppBar Semantic Shell Suppressed - Transactional/Flow screen -->
<main class="flex-grow px-container-margin py-stack-lg flex flex-col items-center justify-start space-y-stack-lg max-w-md mx-auto w-full pt-16 pb-32">
<!-- Header Section -->
<div class="text-center w-full relative">
<div class="absolute inset-0 -z-10 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-[120px] text-primary/10" style="font-variation-settings: 'FILL' 1;">celebration</span>
</div>
<h1 class="text-display-lg font-display-lg text-primary mb-stack-sm drop-shadow-md">Team Won!</h1>
<p class="text-label-xl font-label-xl text-on-surface-variant uppercase tracking-wider">Round Complete</p>
</div>
<!-- Secret Word Reveal Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-stack-lg text-center shadow-[0_4px_20px_-4px_rgba(0,0,0,0.08)] border border-surface-variant relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-2 bg-secondary"></div>
<p class="text-body-md font-body-md text-on-surface-variant mb-unit">The Secret Word Was</p>
<h2 class="text-display-lg font-display-lg text-secondary tracking-tight">GIRAFFE</h2>
</div>
<!-- Chain Progression -->
<div class="w-full">
<h3 class="text-label-xl font-label-xl text-on-surface-variant mb-stack-md text-center">How You Got There</h3>
<div class="flex flex-col space-y-unit relative">
<!-- Line connecting nodes -->
<div class="absolute left-1/2 top-4 bottom-4 w-1 bg-surface-variant -translate-x-1/2 rounded-full -z-10"></div>
<!-- Node 1 -->
<div class="flex items-center justify-center relative">
<div class="bg-surface-container-high rounded-full px-6 py-3 shadow-sm border border-surface-variant z-10">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Long</span>
</div>
</div>
<!-- Arrow -->
<div class="flex justify-center text-outline z-10">
<span class="material-symbols-outlined">arrow_downward</span>
</div>
<!-- Node 2 -->
<div class="flex items-center justify-center relative">
<div class="bg-surface-container-high rounded-full px-6 py-3 shadow-sm border border-surface-variant z-10">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Neck</span>
</div>
</div>
<!-- Arrow -->
<div class="flex justify-center text-outline z-10">
<span class="material-symbols-outlined">arrow_downward</span>
</div>
<!-- Node 3 -->
<div class="flex items-center justify-center relative">
<div class="bg-surface-container-high rounded-full px-6 py-3 shadow-sm border border-surface-variant z-10">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Tie</span>
</div>
</div>
<!-- Arrow -->
<div class="flex justify-center text-secondary z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Final Node -->
<div class="flex items-center justify-center relative">
<div class="bg-secondary text-on-secondary rounded-full px-8 py-4 shadow-md z-10 transform scale-105">
<span class="text-headline-lg-mobile font-headline-lg-mobile font-bold tracking-wide">Giraffe</span>
</div>
</div>
</div>
</div>
<!-- Running Score -->
<div class="bg-surface-container rounded-lg py-stack-sm px-stack-md flex items-center space-x-unit border border-outline-variant/30">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
<span class="text-body-lg font-body-lg text-on-surface font-medium">1 of 1 rounds won</span>
</div>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface bg-opacity-95 backdrop-blur-md pb-8 pt-4 px-container-margin z-50 border-t border-surface-variant shadow-[0_-8px_20px_-4px_rgba(0,0,0,0.05)]">
<button class="w-full h-[60px] bg-primary text-on-primary rounded-full text-headline-lg-mobile font-headline-lg-mobile flex items-center justify-center shadow-lg active:scale-95 transition-transform duration-100 border-t border-white/20">
            Next Round
        </button>
</div>
