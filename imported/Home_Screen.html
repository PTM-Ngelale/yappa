<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Word Chain - Home</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "#ffb3b0",
              "surface-variant": "#e4e3d7",
              background: "#fbfaee",
              "on-tertiary-container": "#003b26",
              "on-secondary": "#ffffff",
              "on-primary": "#ffffff",
              "on-primary-fixed-variant": "#8c1520",
              "on-background": "#1b1c15",
              "surface-tint": "#ae2f34",
              error: "#ba1a1a",
              "inverse-on-surface": "#f2f1e5",
              "on-primary-container": "#6d0010",
              "outline-variant": "#e0bfbd",
              "secondary-fixed-dim": "#5dd9d0",
              "on-error": "#ffffff",
              "on-secondary-container": "#006f69",
              "surface-container-highest": "#e4e3d7",
              "surface-container": "#efeee3",
              "primary-fixed": "#ffdad8",
              "on-tertiary-fixed": "#002113",
              "on-primary-fixed": "#410006",
              "inverse-surface": "#303129",
              "tertiary-container": "#00b179",
              "on-surface": "#1b1c15",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed": "#00201e",
              "error-container": "#ffdad6",
              "surface-container-low": "#f5f4e8",
              "on-tertiary-fixed-variant": "#005236",
              "secondary-container": "#79f3ea",
              "tertiary-fixed-dim": "#52dea2",
              "surface-container-high": "#e9e9dd",
              outline: "#8c706f",
              primary: "#ae2f34",
              "on-tertiary": "#ffffff",
              "surface-dim": "#dbdbcf",
              secondary: "#006a65",
              "on-secondary-fixed-variant": "#00504c",
              "tertiary-fixed": "#72fbbc",
              "on-error-container": "#93000a",
              tertiary: "#006c48",
              "secondary-fixed": "#7cf6ec",
              "primary-container": "#ff6b6b",
              surface: "#fbfaee",
              "inverse-primary": "#ffb3b0",
              "surface-bright": "#fbfaee",
              "on-surface-variant": "#584140",
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
            spacing: {
              "stack-sm": "8px",
              "stack-lg": "32px",
              unit: "8px",
              "stack-md": "16px",
              gutter: "16px",
              "container-margin": "24px",
            },
            fontFamily: {
              "headline-lg": ["Rubik"],
              "body-lg": ["Rubik"],
              "label-xl": ["Rubik"],
              "headline-lg-mobile": ["Rubik"],
              "body-md": ["Rubik"],
              "display-lg": ["Rubik"],
            },
            fontSize: {
              "headline-lg": [
                "32px",
                { lineHeight: "40px", fontWeight: "600" },
              ],
              "body-lg": ["20px", { lineHeight: "30px", fontWeight: "400" }],
              "label-xl": [
                "18px",
                {
                  lineHeight: "22px",
                  letterSpacing: "0.05em",
                  fontWeight: "500",
                },
              ],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "36px", fontWeight: "600" },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Rubik", sans-serif;
        background-color: #fbfaee; /* surface */
        color: #1b1c15; /* on-surface */
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 1,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface flex flex-col h-screen overflow-hidden"
  >
    <!-- Top App Bar (Settings Icon only for Home) -->
    <header class="flex justify-end items-center px-container-margin h-16 pt-4">
      <button
        aria-label="Settings"
        class="p-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95 duration-100"
      >
        <span class="material-symbols-outlined text-primary text-[32px]"
          >settings</span
        >
      </button>
    </header>
    <!-- Main Content Canvas -->
    <main
      class="flex-1 flex flex-col items-center justify-center px-container-margin pb-32"
    >
      <!-- Logo / Title Area -->
      <div class="flex flex-col items-center mb-12">
        <div
          class="w-32 h-32 mb-6 bg-primary-container rounded-3xl flex items-center justify-center shadow-[0_8px_20px_-4px_rgba(0,0,0,0.15)] transform rotate-3"
        >
          <span
            class="material-symbols-outlined text-on-primary-container text-[80px]"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >extension</span
          >
        </div>
        <h1 class="font-display-lg text-display-lg text-primary text-center">
          Word<br />Chain
        </h1>
        <p
          class="font-body-md text-body-md text-on-surface-variant mt-2 text-center max-w-[250px]"
        >
          Link words, break minds, have fun.
        </p>
      </div>
      <!-- Action Buttons -->
      <div class="w-full flex flex-col gap-stack-md max-w-sm">
        <button
          class="w-full h-[64px] bg-primary text-on-primary font-headline-lg-mobile text-headline-lg-mobile rounded-full shadow-[0_4px_12px_-2px_rgba(174,47,52,0.3)] active:scale-98 active:shadow-none transition-all duration-200 border-t border-[rgba(255,255,255,0.2)]"
        >
          Create Game
        </button>
        <button
          class="w-full h-[64px] bg-surface-container-high text-primary font-headline-lg-mobile text-headline-lg-mobile rounded-full shadow-[0_4px_12px_-2px_rgba(0,0,0,0.08)] active:scale-98 active:shadow-none transition-all duration-200"
        >
          Join Game
        </button>
        <button
          class="w-full h-[48px] bg-transparent text-on-surface-variant font-label-xl text-label-xl rounded-full mt-stack-sm active:opacity-70 transition-opacity"
        >
          How to Play
        </button>
      </div>
    </main>
    <!-- BottomNavBar (Shared Component) -->
    <nav
      class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-8 pt-4 bg-surface shadow-[0_-4px_20px_-4px_rgba(0,0,0,0.08)] rounded-t-lg md:hidden"
    >
      <!-- Game (Active) -->
      <div
        class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-2 scale-98 transition-all duration-200 cursor-pointer"
      >
        <span
          class="material-symbols-outlined"
          data-icon="sports_esports"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >sports_esports</span
        >
        <span class="text-label-xl font-label-xl mt-1 text-[14px]">Game</span>
      </div>
      <!-- History (Inactive) -->
      <div
        class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors rounded-xl cursor-pointer"
      >
        <span class="material-symbols-outlined" data-icon="history"
          >history</span
        >
        <span class="text-label-xl font-label-xl mt-1 text-[14px]"
          >History</span
        >
      </div>
      <!-- Profile (Inactive) -->
      <div
        class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors rounded-xl cursor-pointer"
      >
        <span class="material-symbols-outlined" data-icon="person">person</span>
        <span class="text-label-xl font-label-xl mt-1 text-[14px]"
          >Profile</span
        >
      </div>
    </nav>
  </body>
</html>
