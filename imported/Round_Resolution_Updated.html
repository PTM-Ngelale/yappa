<style>
      .word-chain-line {
        position: absolute;
        width: 2px;
        background-color: theme('colors.outline');
        left: 50%;
        transform: translateX(-50%);
        z-index: 0;
      }
      .word-chain-node {
        position: relative;
        z-index: 10;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-16 pb-32">
<!-- TopAppBar Shell (Suppressed Nav for Transactional State, keeping Title structural elements only) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-center items-center px-container-margin h-16 bg-surface flat no shadows">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile font-bold text-primary">Round Resolution</h1>
</header>
<main class="flex-1 flex flex-col items-center px-container-margin pt-stack-md w-full max-w-md mx-auto">
<!-- Round Result & Target Word Header -->
<section class="flex flex-col items-center w-full mb-stack-lg animate-fade-in text-center">
<div class="inline-flex items-center justify-center bg-tertiary-container text-on-tertiary-container rounded-full px-6 py-2 mb-stack-sm">
<span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
<span class="text-label-xl font-label-xl uppercase tracking-wider">Team Won!</span>
</div>
<p class="text-body-lg font-body-lg text-on-surface-variant mb-unit">Target Word</p>
<h2 class="text-display-lg font-display-lg text-primary uppercase tracking-widest break-all">GIRAFFE</h2>
<div class="mt-stack-sm bg-surface-variant rounded-full px-4 py-1.5 shadow-sm inline-flex items-center">
<span class="material-symbols-outlined text-secondary text-sm mr-2" style="font-variation-settings: 'FILL' 1;">bar_chart</span>
<p class="text-body-md font-body-md text-on-surface">1 of 1 rounds won so far</p>
</div>
</section>
<!-- Word Chain Visualization (The "How You Got There" sequence) -->
<section class="w-full relative flex flex-col items-center py-stack-md bg-surface-container rounded-lg shadow-inner mb-stack-lg overflow-hidden">
<h3 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface-variant mb-stack-md px-4 text-center">How You Got There</h3>
<div class="relative w-full px-gutter flex flex-col items-center py-4">
<!-- Continuous connecting line -->
<div class="word-chain-line top-0 bottom-0"></div>
<!-- Node 1 -->
<div class="word-chain-node flex items-center justify-center w-full mb-stack-lg">
<div class="bg-surface border-2 border-outline rounded-xl px-6 py-3 shadow-[0_4px_12px_-4px_rgba(0,0,0,0.1)] transition-transform duration-200">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Long</span>
</div>
</div>
<!-- Arrow down (Visual cue over the line) -->
<div class="absolute left-1/2 transform -translate-x-1/2 mt-12 z-20 text-outline bg-surface-container rounded-full h-8 w-8 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_downward</span>
</div>
<!-- Node 2 -->
<div class="word-chain-node flex items-center justify-center w-full mb-stack-lg mt-stack-md">
<div class="bg-surface border-2 border-outline rounded-xl px-6 py-3 shadow-[0_4px_12px_-4px_rgba(0,0,0,0.1)] transition-transform duration-200">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Neck</span>
</div>
</div>
<!-- Arrow down -->
<div class="absolute left-1/2 transform -translate-x-1/2 mt-[12.5rem] z-20 text-outline bg-surface-container rounded-full h-8 w-8 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_downward</span>
</div>
<!-- Node 3 -->
<div class="word-chain-node flex items-center justify-center w-full mb-stack-lg mt-stack-md">
<div class="bg-surface border-2 border-outline rounded-xl px-6 py-3 shadow-[0_4px_12px_-4px_rgba(0,0,0,0.1)] transition-transform duration-200">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Tie</span>
</div>
</div>
<!-- Arrow down -->
<div class="absolute left-1/2 transform -translate-x-1/2 mt-[22rem] z-20 text-outline bg-surface-container rounded-full h-8 w-8 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_downward</span>
</div>
<!-- Final Node (Target Word) -->
<div class="word-chain-node flex items-center justify-center w-full mt-stack-md">
<div class="bg-tertiary-fixed text-on-tertiary-fixed border-2 border-tertiary-fixed rounded-xl px-8 py-4 shadow-lg flex items-center gap-3 transform scale-105">
<span class="text-headline-lg-mobile font-headline-lg-mobile font-bold uppercase tracking-wide">Giraffe</span>
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area (Transactional "Next" Action, Navigation suppressed) -->
<div class="fixed bottom-0 left-0 w-full z-50 px-container-margin pb-8 pt-4 bg-gradient-to-t from-background via-background to-transparent">
<button class="w-full bg-primary text-on-primary rounded-full h-16 flex items-center justify-center shadow-lg hover:shadow-xl active:scale-[0.98] transition-all duration-200 group">
<span class="text-label-xl font-label-xl mr-2 group-hover:tracking-wider transition-all">Next Round</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
